# Project-wide Gradle settings.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the Gradle Daemon.
# Setting a larger heap size helps with OutOfMemoryError during build.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# AndroidX is enabled by default in new projects.
android.useAndroidX=true

# Use the official Kotlin code style.
kotlin.code.style=official

# Enable parallel execution and build cache for better performance
org.gradle.parallel=true
org.gradle.caching=true
